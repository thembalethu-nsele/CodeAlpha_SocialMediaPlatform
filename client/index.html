<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect - Feed</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a class="logo" href="index.html">Connect</a>
    <div id="nav-links"></div>
  </nav>

  <div class="container">
    <h2 class="page-title" id="greeting">Welcome!</h2>
    <p class="muted page-sub">Share what's on your mind with your friends.</p>

    <div class="card composer">
      <div class="composer-top">
        <span id="me-avatar"></span>
        <textarea id="content" maxlength="500" placeholder="What's on your mind?"></textarea>
      </div>

      <div id="photo-preview" class="photo-preview hidden"></div>
      <p class="msg" id="msg"></p>

      <div class="composer-footer">
        <div class="composer-tools">
          <label class="btn btn-outline btn-sm" for="photo">Add photo</label>
          <input type="file" id="photo" accept="image/*" class="hidden" />
          <span class="muted" id="counter">0 / 500</span>
        </div>
        <button class="btn" onclick="createPost()">Post</button>
      </div>
    </div>

    <h3 class="section-title">Latest posts</h3>
    <div id="feed"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/postcard.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
